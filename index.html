<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist App</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F6F4EF; --surface: #FFFFFF; --surface2: #EFECE5;
  --border: #E0DDD5; --border-strong: #C5C0B5;
  --text: #1A1714; --muted: #7A7168; --light: #B0A898;
  --accent: #2D5A3D; --accent-bg: #E8F0EB; --accent-mid: #4A8A5E;
  --radius: 10px; --radius-lg: 16px;
  --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 4px 14px rgba(0,0,0,0.04);
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* HEADER */
header { background: var(--surface); border-bottom: 1px solid var(--border); height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; position: sticky; top: 0; z-index: 50; }
.logo { font-family: 'DM Serif Display', serif; font-size: 20px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
.logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.nav { display: flex; gap: 6px; align-items: center; }
.nav-link { font-size: 13px; color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: var(--radius); transition: all 0.15s; }
.nav-link:hover { background: var(--surface2); color: var(--text); }
.nav-link.active { color: var(--accent); font-weight: 500; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); font-size: 13px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); text-decoration: none; transition: all 0.15s; white-space: nowrap; }
.btn:hover { background: var(--surface2); }
.btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn-primary:hover { background: #234830; }
.btn svg { width: 14px; height: 14px; }

/* HERO */
.hero { padding: 3rem 2rem 2rem; max-width: 1100px; margin: 0 auto; }
.hero h1 { font-family: 'DM Serif Display', serif; font-size: clamp(28px, 4vw, 42px); letter-spacing: -0.5px; line-height: 1.2; margin-bottom: 0.75rem; }
.hero p { font-size: 16px; color: var(--muted); max-width: 480px; line-height: 1.7; }
.hero-actions { display: flex; gap: 10px; margin-top: 1.5rem; flex-wrap: wrap; }

/* STATS BAR */
.stats-bar { max-width: 1100px; margin: 0 auto 2rem; padding: 0 2rem; display: flex; gap: 1rem; flex-wrap: wrap; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; flex: 1; min-width: 140px; box-shadow: var(--shadow); }
.stat-n { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--text); }
.stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* SECTION */
.section { max-width: 1100px; margin: 0 auto 2.5rem; padding: 0 2rem; }
.section-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1rem; }
.section-title { font-family: 'DM Serif Display', serif; font-size: 22px; }
.section-link { font-size: 13px; color: var(--accent); text-decoration: none; }
.section-link:hover { text-decoration: underline; }

/* TEMPLATE GRID */
.template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
.template-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; box-shadow: var(--shadow); transition: all 0.2s; cursor: pointer; text-decoration: none; color: var(--text); display: flex; flex-direction: column; gap: 10px; }
.template-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(45,90,61,0.1); }
.card-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-bg); display: flex; align-items: center; justify-content: center; }
.card-icon svg { width: 20px; height: 20px; color: var(--accent); }
.card-cat { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--light); font-weight: 500; }
.card-title { font-weight: 600; font-size: 15px; line-height: 1.3; }
.card-desc { font-size: 13px; color: var(--muted); line-height: 1.5; flex: 1; }
.card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; border-top: 1px solid var(--border); padding-top: 10px; }
.card-count { font-size: 12px; color: var(--light); }
.card-arrow { color: var(--accent); opacity: 0; transition: opacity 0.15s; }
.template-card:hover .card-arrow { opacity: 1; }
.card-arrow svg { width: 16px; height: 16px; }

/* RECENT LIST */
.recent-list { display: flex; flex-direction: column; gap: 8px; }
.recent-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--text); box-shadow: var(--shadow); transition: all 0.15s; }
.recent-item:hover { border-color: var(--border-strong); }
.recent-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot-open { background: #F0B429; }
.dot-completed { background: var(--accent-mid); }
.dot-archived { background: var(--light); }
.recent-info { flex: 1; min-width: 0; }
.recent-title { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.recent-status { font-size: 11px; padding: 3px 8px; border-radius: 99px; font-weight: 500; white-space: nowrap; }
.status-open { background: #FEF3C7; color: #92400E; }
.status-completed { background: var(--accent-bg); color: var(--accent); }
.status-archived { background: var(--surface2); color: var(--muted); }
.recent-chevron { color: var(--light); flex-shrink: 0; }
.recent-chevron svg { width: 14px; height: 14px; }

/* EMPTY STATE */
.empty { text-align: center; padding: 3rem; color: var(--muted); }
.empty svg { width: 48px; height: 48px; color: var(--border-strong); margin-bottom: 1rem; }
.empty p { font-size: 14px; }

/* LOADING */
.skeleton { background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius-lg); }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.skel-card { height: 180px; }
.skel-row { height: 64px; }

/* TOAST */
.toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--text); color: white; padding: 10px 16px; border-radius: var(--radius); font-size: 13px; z-index: 999; opacity: 0; transform: translateY(10px); transition: all 0.25s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 640px) {
  header { padding: 0 1rem; }
  .hero, .stats-bar, .section { padding-left: 1rem; padding-right: 1rem; }
  .hero h1 { font-size: 26px; }
  .nav-link span { display: none; }
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo"><div class="logo-dot"></div>Checklist</a>
  <nav class="nav">
    <a href="index.html" class="nav-link active">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Home</span>
    </a>
    <a href="history.html" class="nav-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>Ingevuld</span>
    </a>
    <a href="admin.html" class="nav-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
      <span>Admin</span>
    </a>
  </nav>
</header>

<div class="hero">
  <h1>Welke checklist<br>wil je invullen?</h1>
  <p>Kies een template hieronder, vul hem in van op elk toestel, en exporteer als PDF.</p>
  <div class="hero-actions">
    <a href="history.html" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
      Mijn ingevulde checklists
    </a>
    <a href="admin.html" class="btn btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nieuwe template
    </a>
  </div>
</div>

<!-- Stats -->
<div class="stats-bar" id="stats-bar">
  <div class="stat skeleton skel-card" style="height:70px"></div>
  <div class="stat skeleton skel-card" style="height:70px"></div>
  <div class="stat skeleton skel-card" style="height:70px"></div>
</div>

<!-- Templates -->
<div class="section">
  <div class="section-header">
    <h2 class="section-title">Templates</h2>
  </div>
  <div class="template-grid" id="template-grid">
    <div class="skeleton skel-card"></div>
    <div class="skeleton skel-card"></div>
    <div class="skeleton skel-card"></div>
  </div>
</div>

<!-- Recent submissions -->
<div class="section">
  <div class="section-header">
    <h2 class="section-title">Recent ingevuld</h2>
    <a href="history.html" class="section-link">Alles bekijken →</a>
  </div>
  <div class="recent-list" id="recent-list">
    <div class="skeleton skel-row"></div>
    <div class="skeleton skel-row"></div>
    <div class="skeleton skel-row"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const CATEGORY_ICONS = {
  oplevering: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`,
  opstart:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
  assemblage: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>`,
  feedback:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
  default:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/></svg>`
};

function icon(cat) { return CATEGORY_ICONS[cat?.toLowerCase()] || CATEGORY_ICONS.default; }
function itemCount(schema) {
  try { return (schema?.sections||[]).reduce((n,s)=>n+(s.items?.length||0),0); } catch(e){ return 0; }
}
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}
function fmtDate(d) {
  return new Date(d).toLocaleDateString('nl-BE',{day:'2-digit',month:'short',year:'numeric'});
}
function statusLabel(s) {
  const map={open:'Open',completed:'Voltooid',archived:'Gearchiveerd'};
  return map[s]||s;
}

async function loadStats() {
  const [t1, t2] = await Promise.all([
    sb.from('templates').select('id', {count:'exact',head:true}).eq('active',true),
    sb.from('submissions').select('id,status', {count:'exact'})
  ]);
  const total = t2.count || 0;
  const open = (t2.data||[]).filter(r=>r.status==='open').length;
  const done = (t2.data||[]).filter(r=>r.status==='completed').length;
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat"><div class="stat-n">${t1.count||0}</div><div class="stat-label">Actieve templates</div></div>
    <div class="stat"><div class="stat-n">${total}</div><div class="stat-label">Ingevulde checklists</div></div>
    <div class="stat"><div class="stat-n">${open}</div><div class="stat-label">Nog open</div></div>
    <div class="stat"><div class="stat-n">${done}</div><div class="stat-label">Voltooid</div></div>
  `;
}

async function loadTemplates() {
  const { data, error } = await sb.from('templates').select('*').eq('active',true).order('category').order('name');
  const grid = document.getElementById('template-grid');
  if (error || !data?.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <p>Nog geen templates.<br><a href="admin.html" style="color:var(--accent)">Maak er een aan →</a></p>
    </div>`;
    return;
  }
  grid.innerHTML = data.map(t => `
    <a href="fill.html?template=${t.id}" class="template-card">
      <div class="card-icon">${icon(t.category)}</div>
      <div>
        <div class="card-cat">${t.category||'Algemeen'}</div>
        <div class="card-title">${esc(t.name)}</div>
      </div>
      <div class="card-desc">${esc(t.description||'')}</div>
      <div class="card-footer">
        <span class="card-count">${itemCount(t.schema)} vragen</span>
        <span class="card-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>
      </div>
    </a>
  `).join('');
}

async function loadRecent() {
  const { data } = await sb.from('submissions').select('*').order('updated_at',{ascending:false}).limit(5);
  const el = document.getElementById('recent-list');
  if (!data?.length) {
    el.innerHTML = `<div class="empty"><p>Nog geen ingevulde checklists.</p></div>`;
    return;
  }
  el.innerHTML = data.map(r => `
    <a href="fill.html?submission=${r.id}" class="recent-item">
      <div class="recent-dot dot-${r.status}"></div>
      <div class="recent-info">
        <div class="recent-title">${esc(r.template_name||'Checklist')}</div>
        <div class="recent-meta">${r.filled_by?esc(r.filled_by)+' · ':''} ${fmtDate(r.updated_at)}</div>
      </div>
      <span class="recent-status status-${r.status}">${statusLabel(r.status)}</span>
      <span class="recent-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></span>
    </a>
  `).join('');
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Init
Promise.all([loadStats(), loadTemplates(), loadRecent()]).catch(e => {
  toast('Kan geen verbinding maken met de database. Controleer config.js');
  console.error(e);
});
</script>
</body>
</html>
