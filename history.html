<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geschiedenis — FoldrIQ</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="branding.js"></script>
<script src="auth.js"></script>
<script src="sidebar.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#F3F4F6; --surface:#FFFFFF; --surface2:#F9FAFB;
  --border:#E5E7EB; --border-strong:#D1D5DB;
  --text:#111827; --muted:#6B7280; --light:#9CA3AF;
  --accent:#2563EB; --accent-bg:#EFF6FF; --accent-mid:#3B82F6;
  --warn:#D97706; --warn-bg:#FFFBEB;
  --danger:#EF4444; --danger-bg:#FEF2F2;
  --success:#10B981; --success-bg:#ECFDF5;
  --radius:8px; --radius-lg:12px;
  --shadow:0 1px 2px rgba(0,0,0,0.05),0 4px 12px rgba(0,0,0,0.04);
}
body { font-family:'Poppins',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
header { background:var(--surface); border-bottom:1px solid var(--border); height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 2rem; position:sticky; top:0; z-index:50; gap:12px; }
.logo { font-family:'Poppins',sans-serif; font-size:20px; display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); }
.logo-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
.nav { display:flex; gap:6px; align-items:center; }
.nav-link { font-size:13px; color:var(--muted); text-decoration:none; padding:6px 12px; border-radius:var(--radius); transition:all 0.15s; display:flex; align-items:center; gap:5px; }
.nav-link:hover { background:var(--surface2); color:var(--text); }
.nav-link.active { color:var(--accent); font-weight:500; }
.nav-link svg { width:14px; height:14px; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:var(--radius); font-size:13px; font-family:'Poppins',sans-serif; font-weight:500; cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--text); text-decoration:none; transition:all 0.15s; }
.btn:hover { background:var(--surface2); }
.btn svg { width:14px; height:14px; }
.btn-primary { background:var(--accent); color:white; border-color:var(--accent); }
.btn-primary:hover { background:#1D4ED8; }
.btn-danger { color:var(--danger); border-color:transparent; }
.btn-danger:hover { background:var(--danger-bg); border-color:var(--danger); }

/* LAYOUT */
.container { max-width:900px; margin:0 auto; padding:2rem 1.5rem 4rem; }
.page-header { margin-bottom:1.5rem; }
.page-title { font-family:'Poppins',sans-serif; font-size:28px; }
.page-subtitle { font-size:14px; color:var(--muted); margin-top:4px; }

/* TOOLBAR */
.toolbar { display:flex; gap:10px; margin-bottom:1.25rem; flex-wrap:wrap; align-items:center; }
.search-wrap { position:relative; flex:1; min-width:200px; }
.search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--light); pointer-events:none; }
.search-icon svg { width:15px; height:15px; }
.search-input { width:100%; font-family:'Poppins',sans-serif; font-size:14px; padding:8px 12px 8px 34px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); outline:none; }
.search-input:focus { border-color:var(--accent); }
.filter-select { font-family:'Poppins',sans-serif; font-size:13px; padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); outline:none; cursor:pointer; }
.filter-select:focus { border-color:var(--accent); }

/* STATS ROW */
.stats-row { display:flex; gap:10px; margin-bottom:1.25rem; flex-wrap:wrap; }
.stat-pill { padding:6px 14px; border-radius:99px; font-size:13px; border:1px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; transition:all 0.15s; display:flex; align-items:center; gap:6px; }
.stat-pill:hover { border-color:var(--border-strong); }
.stat-pill.active { background:var(--accent); color:white; border-color:var(--accent); }
.stat-pill .count { font-weight:600; }
.dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot-open { background:#F0B429; }
.dot-completed { background:var(--accent-mid); }
.dot-archived { background:var(--light); }

/* LIST */
.list-wrap { display:flex; flex-direction:column; gap:8px; }
.sub-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:1rem 1.25rem; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow); transition:all 0.15s; }
.sub-card:hover { border-color:var(--border-strong); }
.sub-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.sub-info { flex:1; min-width:0; }
.sub-title { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sub-meta { font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; }
.sub-meta span { display:flex; align-items:center; gap:3px; }
.sub-actions { display:flex; gap:6px; align-items:center; flex-shrink:0; }
.status-badge { padding:3px 9px; border-radius:99px; font-size:11px; font-weight:500; white-space:nowrap; }
.status-open { background:var(--warn-bg); color:#92400E; }
.status-completed { background:var(--accent-bg); color:var(--accent); }
.status-archived { background:var(--surface2); color:var(--muted); }

/* PROGRESS MINI */
.mini-progress { height:3px; background:var(--surface2); border-radius:99px; margin-top:6px; overflow:hidden; }
.mini-fill { height:100%; background:var(--accent); border-radius:99px; }

/* EMPTY */
.empty { text-align:center; padding:4rem 2rem; color:var(--muted); }
.empty svg { width:48px; height:48px; color:var(--border-strong); margin-bottom:1rem; }
.empty h3 { font-size:16px; margin-bottom:6px; color:var(--text); }
.empty p { font-size:14px; }

/* SKELETON */
.skeleton { background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:var(--radius-lg); height:80px; }
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* MODAL */
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; align-items:center; justify-content:center; padding:1rem; }
.overlay.open { display:flex; }
.modal { background:var(--surface); border-radius:var(--radius-lg); padding:1.5rem; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
.modal h2 { font-family:'Poppins',sans-serif; font-size:20px; margin-bottom:0.75rem; }
.modal p { font-size:14px; color:var(--muted); margin-bottom:1.25rem; line-height:1.6; }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; }

.toast { position:fixed; bottom:1.5rem; right:1.5rem; background:var(--text); color:white; padding:10px 16px; border-radius:var(--radius); font-size:13px; z-index:999; opacity:0; transform:translateY(10px); transition:all 0.25s; pointer-events:none; }
.toast.show { opacity:1; transform:translateY(0); }
.toast.success { background:var(--accent); }
.toast.error { background:var(--danger); }

@media(max-width:640px){
  header { padding:0 1rem; }
  .container { padding:1rem 0.75rem 3rem; }
  .sub-actions .btn .btn-label { display:none; }
}

/* USER PILL */
.user-pill { display:flex; align-items:center; gap:8px; }
.user-avatar { width:28px; height:28px; border-radius:50%; background:var(--accent); color:white; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.user-name { font-size:13px; color:var(--text); max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.user-role-badge { font-size:10px; background:var(--accent-bg); color:var(--accent); padding:2px 7px; border-radius:99px; font-weight:600; white-space:nowrap; }
.user-logout { background:none; border:none; cursor:pointer; color:var(--muted); display:flex; align-items:center; padding:4px; border-radius:6px; transition:color 0.15s; }
.user-logout:hover { color:var(--danger); }


/* ═══ APP LAYOUT + SIDEBAR ═══════════════════════════════════════════════ */
#app-root { display:flex; min-height:100vh; }
.sidebar {
  width:240px; background:#0D1B2A; display:flex; flex-direction:column;
  flex-shrink:0; position:fixed; top:0; left:0; bottom:0; z-index:40;
  overflow-y:auto;
}
.sb-logo { padding:18px 16px 14px; border-bottom:1px solid rgba(255,255,255,0.07); }
.sb-logo a { display:block; }
.sb-logo-img { height:28px; width:auto; object-fit:contain; max-width:180px; }
.sb-nav { flex:1; padding:10px 8px; display:flex; flex-direction:column; gap:1px; }
.sb-nav-item {
  display:flex; align-items:center; gap:10px; padding:9px 12px;
  border-radius:7px; font-size:13.5px; font-weight:500; text-decoration:none;
  color:rgba(255,255,255,0.52); transition:all 0.15s;
  border-left:3px solid transparent;
}
.sb-nav-item:hover { background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.9); }
.sb-nav-item.active { background:rgba(37,99,235,0.18); color:#fff; border-left-color:#2563EB; }
.sb-nav-icon { width:18px; height:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.sb-nav-icon svg { width:18px; height:18px; }
.sb-footer { padding:12px; border-top:1px solid rgba(255,255,255,0.07); }
#main-area { margin-left:240px; flex:1; display:flex; flex-direction:column; min-height:100vh; background:var(--bg); }
/* User pill — dark sidebar context */
.user-pill { display:flex; align-items:center; gap:8px; }
.user-avatar { width:30px; height:30px; border-radius:50%; background:#2563EB; color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.user-name { font-size:12px; color:rgba(255,255,255,0.75); max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.2; }
.user-role-badge { font-size:10px; background:rgba(37,99,235,0.3); color:#93C5FD; padding:1px 6px; border-radius:99px; font-weight:600; white-space:nowrap; }
.user-logout { background:none; border:none; cursor:pointer; color:rgba(255,255,255,0.3); display:flex; align-items:center; padding:4px; border-radius:6px; transition:color 0.15s; margin-left:auto; flex-shrink:0; }
.user-logout:hover { color:#EF4444; }
@media(max-width:768px){
  .sidebar { transform:translateX(-100%); transition:transform 0.25s; }
  #main-area { margin-left:0; }
}</style>
</head>
<body>

<div id="app-root"><div id="sidebar-container"></div><div id="main-area">

<div class="container">
  <div class="page-header">
    <div class="page-title">Ingevulde checklists</div>
    <div class="page-subtitle" id="total-label">Laden…</div>
  </div>

  <!-- Filter pills -->
  <div class="stats-row">
    <div class="stat-pill active" data-filter="all" onclick="setFilter('all',this)">
      <span class="count" id="cnt-all">0</span> Alles
    </div>
    <div class="stat-pill" data-filter="open" onclick="setFilter('open',this)">
      <span class="dot dot-open"></span><span class="count" id="cnt-open">0</span> Open
    </div>
    <div class="stat-pill" data-filter="completed" onclick="setFilter('completed',this)">
      <span class="dot dot-completed"></span><span class="count" id="cnt-completed">0</span> Voltooid
    </div>
    <div class="stat-pill" data-filter="archived" onclick="setFilter('archived',this)">
      <span class="dot dot-archived"></span><span class="count" id="cnt-archived">0</span> Gearchiveerd
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <div class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
      <input class="search-input" type="text" placeholder="Zoeken op naam, invuller, organisatie…" id="search-input" oninput="applyFilters()">
    </div>
    <select class="filter-select" id="cat-filter" onchange="applyFilters()">
      <option value="">Alle categorieën</option>
      <option value="oplevering">Oplevering</option>
      <option value="opstart">Opstart</option>
      <option value="assemblage">Assemblage</option>
      <option value="feedback">Feedback</option>
      <option value="inspectie">Inspectie</option>
      <option value="onderhoud">Onderhoud</option>
    </select>
    <select class="filter-select" id="sort-select" onchange="applyFilters()">
      <option value="updated_desc">Laatste gewijzigd</option>
      <option value="updated_asc">Oudste eerst</option>
      <option value="name_asc">Naam A–Z</option>
      <option value="status">Status</option>
    </select>
  </div>

  <!-- List -->
  <div class="list-wrap" id="list-wrap">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="overlay" id="del-overlay">
  <div class="modal">
    <h2>Verwijderen?</h2>
    <p>Deze ingevulde checklist wordt permanent verwijderd, inclusief alle foto's. Dit kan niet ongedaan worden gemaakt.</p>
    <div class="modal-actions">
      <button class="btn" onclick="closeDelModal()">Annuleer</button>
      <button class="btn" style="background:var(--danger);color:white;border-color:var(--danger)" onclick="confirmDelete()">Verwijder</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// sb uses the authenticated shared client from auth.js
const sb = window.sb;
let allData = [];
let activeFilter = 'all';
let deleteId = null;

// ── LOAD ──
async function load() {
  // Load all submissions — RLS handles visibility
  const { data, error } = await sb.from('submissions')
    .select('*')
    .order('updated_at', { ascending: false });

  if (error) { toast('Kan data niet laden: '+error.message, 'error'); return; }
  allData = data || [];
  updateCounts();
  applyFilters();
}

function updateCounts() {
  document.getElementById('cnt-all').textContent = allData.length;
  document.getElementById('cnt-open').textContent = allData.filter(r=>r.status==='open').length;
  document.getElementById('cnt-completed').textContent = allData.filter(r=>r.status==='completed').length;
  document.getElementById('cnt-archived').textContent = allData.filter(r=>r.status==='archived').length;
  document.getElementById('total-label').textContent = `${allData.length} checklists gevonden`;
}

function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.stat-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const cat = document.getElementById('cat-filter').value;
  const sort = document.getElementById('sort-select').value;

  let filtered = allData.filter(r => {
    if (activeFilter !== 'all' && r.status !== activeFilter) return false;
    if (cat && r.template_name?.toLowerCase().indexOf(cat) === -1) return false;
    if (q) {
      const haystack = [r.template_name, r.customer, r.reference, r.filled_by, r.organisation, r.location, r.notes].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  // Sort
  filtered.sort((a,b) => {
    if (sort==='updated_asc') return new Date(a.updated_at)-new Date(b.updated_at);
    if (sort==='name_asc') {
      const nameA = [a.template_name, a.customer, a.reference].filter(Boolean).join(' ');
      const nameB = [b.template_name, b.customer, b.reference].filter(Boolean).join(' ');
      return nameA.localeCompare(nameB);
    }
    if (sort==='status') { const order={open:0,completed:1,archived:2}; return (order[a.status]||0)-(order[b.status]||0); }
    return new Date(b.updated_at)-new Date(a.updated_at);
  });

  document.getElementById('total-label').textContent =
    `${filtered.length} van ${allData.length} checklist${allData.length !== 1 ? 's' : ''}`;
  renderList(filtered);
}

// ── RENDER ──
function renderList(data) {
  const el = document.getElementById('list-wrap');
  if (!data.length) {
    el.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <h3>Geen resultaten</h3>
      <p>Pas de filters aan of <a href="index.html" style="color:var(--accent)">start een nieuwe checklist</a>.</p>
    </div>`;
    return;
  }

  el.innerHTML = data.map(r => {
    const answers = r.answers || {};
    const totalQ = Object.keys(answers).length;
    const doneQ = Object.values(answers).filter(a => a.checked).length;
    const pct = totalQ ? Math.round((doneQ/totalQ)*100) : 0;
    const dateStr = new Date(r.updated_at).toLocaleDateString('nl-BE', {day:'2-digit',month:'short',year:'numeric'});

    return `<div class="sub-card">
      <div class="sub-dot dot-${r.status}"></div>
      <div class="sub-info">
        <div class="sub-title">
          ${esc(r.template_name||'Naamloze checklist')}
          ${r.customer?`<span style="color:var(--accent);font-weight:500"> · ${esc(r.customer)}</span>`:''}
          ${r.reference?`<span style="color:var(--muted);font-size:13px;font-weight:400"> · ${esc(r.reference)}</span>`:''}
        </div>
        <div class="sub-meta">
          ${r.filled_by?`<span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${esc(r.filled_by)}</span>`:''}
          ${r.location?`<span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(r.location)}</span>`:''}
          <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${dateStr}</span>
          <span>${pct}% voltooid</span>
        </div>
        <div class="mini-progress"><div class="mini-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="sub-actions">
        <span class="status-badge status-${r.status}">${STATUS_LABELS[r.status]||r.status}</span>
        <a href="fill.html?submission=${r.id}" class="btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span class="btn-label">Openen</span>
        </a>
        ${r.status !== 'archived' ? `<button class="btn" onclick="archiveItem('${r.id}',event)" title="Archiveer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        </button>` : ''}
        <button class="btn btn-danger" onclick="openDelModal('${r.id}',event)" title="Verwijder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');
}

const STATUS_LABELS = { open:'Open', completed:'Voltooid', archived:'Gearchiveerd' };

// ── ACTIONS ──
async function archiveItem(id, e) {
  e.stopPropagation();
  const { error } = await sb.from('submissions').update({ status:'archived' }).eq('id', id);
  if (error) { toast('Fout: '+error.message, 'error'); return; }
  allData = allData.map(r => r.id===id ? {...r, status:'archived'} : r);
  updateCounts();
  applyFilters();
  toast('Gearchiveerd');
}

function openDelModal(id, e) {
  e.stopPropagation();
  deleteId = id;
  document.getElementById('del-overlay').classList.add('open');
}
function closeDelModal() { document.getElementById('del-overlay').classList.remove('open'); deleteId = null; }

async function confirmDelete() {
  if (!deleteId) return;
  // Delete photos from storage first
  const { data: photos } = await sb.from('photos').select('storage_path').eq('submission_id', deleteId);
  if (photos?.length) {
    const paths = photos.map(p => p.storage_path);
    await sb.storage.from(STORAGE_BUCKET).remove(paths);
  }
  // Delete the submission — count verifies the RLS policy actually allowed it
  const { error, count } = await sb.from('submissions').delete({ count: 'exact' }).eq('id', deleteId);
  if (error) {
    toast('Fout: ' + error.message, 'error');
    closeDelModal();
    return;
  }
  if (count === 0) {
    toast('Verwijderen mislukt — controleer Supabase RLS policy voor submissions', 'error');
    closeDelModal();
    return;
  }
  allData = allData.filter(r => r.id !== deleteId);
  updateCounts();
  applyFilters();
  closeDelModal();
  toast('Verwijderd');
}

// ── UTILS ──
function toast(msg, type='') {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show '+(type||'');
  setTimeout(()=>el.className='toast',2500);
}
