<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen — FoldrIQ</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="branding.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#F3F4F6; --surface:#FFFFFF;
  --border:#E5E7EB; --border-strong:#D1D5DB;
  --text:#111827; --muted:#6B7280;
  --accent:#2563EB; --accent-bg:#EFF6FF;
  --danger:#EF4444; --danger-bg:#FEF2F2;
  --success:#10B981; --success-bg:#ECFDF5;
  --radius:8px; --radius-lg:12px;
}
body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}

.login-wrap { width: 100%; max-width: 400px; }

.logo-block {
  display: flex;
  justify-content: center;
  margin-bottom: 2rem;
}
.logo-block img { height: 36px; max-width: 200px; object-fit: contain; }
.logo-text {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: inline-block; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 2rem;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 8px 32px rgba(0,0,0,0.06);
}
.card-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.card-sub { font-size: 14px; color: var(--muted); margin-bottom: 1.5rem; line-height: 1.6; }

.field { margin-bottom: 1rem; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.field input {
  width: 100%;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}
.field input:focus { border-color: var(--accent); background: var(--surface); }

.btn-login {
  width: 100%;
  padding: 11px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
  margin-top: 0.5rem;
}
.btn-login:hover { background: #1D4ED8; }
.btn-login:disabled { background: var(--border-strong, #D1D5DB); cursor: not-allowed; }

.error-msg {
  background: var(--danger-bg);
  border: 1px solid #FECACA;
  color: #B91C1C;
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 1rem;
  display: none;
}
.error-msg.show { display: block; }

.success-msg {
  background: var(--success-bg);
  border: 1px solid #A7F3D0;
  color: #065F46;
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 1rem;
  display: none;
}
.success-msg.show { display: block; }

.forgot-link {
  display: block;
  text-align: center;
  margin-top: 1rem;
  font-size: 13px;
  color: var(--muted);
  text-decoration: none;
  cursor: pointer;
}
.forgot-link:hover { color: var(--accent); }

.reset-panel { display: none; }
.reset-panel.show { display: block; }
.login-panel.hide { display: none; }

.footer-note {
  text-align: center;
  margin-top: 1.5rem;
  font-size: 12px;
  color: #9CA3AF;
}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="logo-block" id="login-logo-block">
    <!-- filled by JS below -->
  </div>

  <div class="card">

    <!-- Login panel -->
    <div class="login-panel" id="login-panel">
      <div class="card-title">Welkom terug</div>
      <div class="card-sub">Log in om checklists in te vullen en te beheren.</div>

      <div class="error-msg" id="login-error"></div>

      <div class="field">
        <label>E-mailadres</label>
        <input type="email" id="email" placeholder="naam@foldriq.com" autocomplete="email"
          onkeydown="if(event.key==='Enter')document.getElementById('password').focus()">
      </div>
      <div class="field">
        <label>Wachtwoord</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>

      <button class="btn-login" id="login-btn" onclick="doLogin()">Inloggen</button>
      <a class="forgot-link" onclick="showReset()">Wachtwoord vergeten?</a>
    </div>

    <!-- Reset password panel -->
    <div class="reset-panel" id="reset-panel">
      <div class="card-title">Wachtwoord herstellen</div>
      <div class="card-sub">Vul je e-mailadres in. Je ontvangt een link om een nieuw wachtwoord in te stellen.</div>

      <div class="error-msg" id="reset-error"></div>
      <div class="success-msg" id="reset-success">Reset-link verzonden! Controleer je e-mail.</div>

      <div class="field">
        <label>E-mailadres</label>
        <input type="email" id="reset-email" placeholder="naam@foldriq.com"
          onkeydown="if(event.key==='Enter')doReset()">
      </div>

      <button class="btn-login" onclick="doReset()">Reset-link versturen</button>
      <a class="forgot-link" onclick="showLogin()">← Terug naar inloggen</a>
    </div>

  </div>

  <div class="footer-note">FoldrIQ · <a href="mailto:info@foldriq.com" style="color:inherit">info@foldriq.com</a></div>
</div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

sb.auth.getSession().then(({ data: { session } }) => {
  if (session) redirectAfterLogin();
});

sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN') redirectAfterLogin();
});

function redirectAfterLogin() {
  const redirect = new URLSearchParams(location.search).get('redirect') || 'index.html';
  location.href = redirect;
}

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');

  if (!email || !pw) { showError(errEl, 'Vul je e-mail en wachtwoord in.'); return; }

  btn.disabled = true; btn.textContent = 'Inloggen…';
  errEl.classList.remove('show');

  const { error } = await sb.auth.signInWithPassword({ email, password: pw });

  if (error) {
    btn.disabled = false; btn.textContent = 'Inloggen';
    const msg = error.message.includes('Invalid') ? 'Ongeldig e-mailadres of wachtwoord.' : error.message;
    showError(errEl, msg);
  }
}

async function doReset() {
  const email = document.getElementById('reset-email').value.trim();
  const errEl = document.getElementById('reset-error');
  const sucEl = document.getElementById('reset-success');

  if (!email) { showError(errEl, 'Vul je e-mailadres in.'); return; }

  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + location.pathname.replace('login.html','') + 'login.html'
  });

  if (error) { showError(errEl, error.message); }
  else { sucEl.classList.add('show'); errEl.classList.remove('show'); }
}

function showReset() {
  document.getElementById('login-panel').classList.add('hide');
  document.getElementById('reset-panel').classList.add('show');
}
function showLogin() {
  document.getElementById('reset-panel').classList.remove('show');
  document.getElementById('login-panel').classList.remove('hide');
}
function showError(el, msg) { el.textContent = msg; el.classList.add('show'); }

// Logo from branding or default
(function () {
  var b = getBranding();
  var block = document.getElementById('login-logo-block');
  if (!block) return;
  if (b.logo) {
    var img = document.createElement('img');
    img.src = b.logo;
    img.alt = b.companyName || 'FoldrIQ';
    block.appendChild(img);
  } else {
    var img2 = document.createElement('img');
    img2.src = 'foldriq-logo.png';
    img2.alt = 'FoldrIQ';
    img2.style.cssText = 'height:36px;object-fit:contain';
    img2.onerror = function () {
      this.style.display = 'none';
      var span = document.createElement('span');
      span.className = 'logo-text';
      span.textContent = b.companyName || 'FoldrIQ';
      block.appendChild(span);
    };
    block.appendChild(img2);
  }
})();
</script>
</body>
</html>
