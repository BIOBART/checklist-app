<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Checklist App</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#F6F4EF; --surface:#FFFFFF; --surface2:#EFECE5;
  --border:#E0DDD5; --border-strong:#C5C0B5;
  --text:#1A1714; --muted:#7A7168; --light:#B0A898;
  --accent:#2D5A3D; --accent-bg:#E8F0EB; --accent-mid:#4A8A5E;
  --danger:#C0392B; --danger-bg:#FDECEA;
  --radius:10px; --radius-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,0.05),0 4px 14px rgba(0,0,0,0.04);
}
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
header { background:var(--surface); border-bottom:1px solid var(--border); height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 2rem; position:sticky; top:0; z-index:50; }
.logo { font-family:'DM Serif Display',serif; font-size:20px; display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); }
.logo-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
.nav { display:flex; gap:6px; align-items:center; }
.nav-link { font-size:13px; color:var(--muted); text-decoration:none; padding:6px 12px; border-radius:var(--radius); transition:all 0.15s; display:flex; align-items:center; gap:5px; }
.nav-link:hover { background:var(--surface2); color:var(--text); }
.nav-link.active { color:var(--accent); font-weight:500; }
.nav-link svg { width:14px; height:14px; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:var(--radius); font-size:13px; font-family:'DM Sans',sans-serif; font-weight:500; cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--text); transition:all 0.15s; white-space:nowrap; }
.btn:hover { background:var(--surface2); }
.btn-primary { background:var(--accent); color:white; border-color:var(--accent); }
.btn-primary:hover { background:#234830; }
.btn-danger { color:var(--danger); border-color:var(--danger); }
.btn-danger:hover { background:var(--danger-bg); }
.btn svg { width:14px; height:14px; }

/* LOGIN SCREEN */
#login-screen { display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 60px); padding:2rem; }
.login-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:2rem; width:100%; max-width:380px; box-shadow:var(--shadow); }
.login-card h2 { font-family:'DM Serif Display',serif; font-size:22px; margin-bottom:0.5rem; }
.login-card p { font-size:13px; color:var(--muted); margin-bottom:1.5rem; }
.field-label { font-size:12px; color:var(--muted); font-weight:500; display:block; margin-bottom:4px; }
.field-input { width:100%; font-family:'DM Sans',sans-serif; font-size:14px; padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg); color:var(--text); outline:none; margin-bottom:12px; }
.field-input:focus { border-color:var(--accent); background:var(--surface); }
.login-error { font-size:13px; color:var(--danger); margin-bottom:12px; display:none; }

/* MAIN LAYOUT */
#admin-screen { display:none; }
.container { max-width:1100px; margin:0 auto; padding:2rem; }
.page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:2rem; flex-wrap:wrap; gap:12px; }
.page-title { font-family:'DM Serif Display',serif; font-size:28px; }
.page-subtitle { font-size:14px; color:var(--muted); margin-top:4px; }

/* TEMPLATE LIST */
.template-list { display:flex; flex-direction:column; gap:10px; margin-bottom:2rem; }
.tpl-row { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:1rem 1.25rem; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow); }
.tpl-info { flex:1; min-width:0; }
.tpl-name { font-weight:600; font-size:15px; }
.tpl-meta { font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; }
.tpl-badge { padding:2px 8px; border-radius:99px; font-size:11px; background:var(--accent-bg); color:var(--accent); font-weight:500; }
.tpl-actions { display:flex; gap:6px; }

/* EDITOR */
#editor { display:none; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:1.5rem; box-shadow:var(--shadow); }
.editor-header { display:flex; align-items:center; gap:12px; margin-bottom:1.5rem; padding-bottom:1.25rem; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.editor-title { font-family:'DM Serif Display',serif; font-size:22px; flex:1; }

/* FORM FIELDS */
.field-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:1rem; }
.field-row.full { grid-template-columns:1fr; }
@media(max-width:600px){ .field-row { grid-template-columns:1fr; } }
.field-group { display:flex; flex-direction:column; gap:4px; }
.field-select { width:100%; font-family:'DM Sans',sans-serif; font-size:14px; padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg); color:var(--text); outline:none; }
.field-select:focus { border-color:var(--accent); }
.field-textarea { width:100%; font-family:'DM Sans',sans-serif; font-size:14px; padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg); color:var(--text); outline:none; resize:vertical; min-height:60px; }
.field-textarea:focus { border-color:var(--accent); }

/* SECTIONS IN EDITOR */
.sections-wrap { display:flex; flex-direction:column; gap:12px; margin:1.25rem 0; }
.sec-card { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; }
.sec-head { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--surface2); border-bottom:1px solid var(--border); }
.sec-title-input { flex:1; border:none; outline:none; background:transparent; font-family:'DM Sans',sans-serif; font-weight:600; font-size:14px; color:var(--text); }
.icon-btn { background:none; border:none; cursor:pointer; color:var(--light); padding:4px; display:flex; align-items:center; border-radius:6px; transition:all 0.15s; }
.icon-btn:hover { color:var(--muted); background:var(--border); }
.icon-btn svg { width:14px; height:14px; }

/* ITEMS IN SECTION */
.items-wrap { padding:8px 14px 4px; }
.item-row { display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
.item-row:last-child { border-bottom:none; }
.item-fields { flex:1; display:grid; grid-template-columns:1fr auto auto auto; gap:8px; align-items:center; }
@media(max-width:600px){ .item-fields { grid-template-columns:1fr auto; } }
.item-label-input { font-family:'DM Sans',sans-serif; font-size:14px; padding:6px 10px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); outline:none; }
.item-label-input:focus { border-color:var(--accent); }
.item-type-select { font-family:'DM Sans',sans-serif; font-size:12px; padding:6px 8px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); outline:none; cursor:pointer; }
.item-req { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); white-space:nowrap; cursor:pointer; }
.item-req input { accent-color:var(--accent); width:14px; height:14px; cursor:pointer; }
.item-options-input { font-family:'DM Sans',sans-serif; font-size:12px; padding:5px 8px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); outline:none; width:100%; margin-top:4px; }
.item-options-input:focus { border-color:var(--accent); }

/* ADD ITEM ROW */
.add-item-row { display:flex; gap:8px; padding:8px 0; flex-wrap:wrap; }
.add-item-btn { font-size:12px; color:var(--muted); background:none; border:1px dashed var(--border-strong); border-radius:var(--radius); cursor:pointer; font-family:'DM Sans',sans-serif; display:flex; align-items:center; gap:4px; padding:5px 10px; transition:all 0.15s; }
.add-item-btn:hover { border-color:var(--accent); color:var(--accent); }
.add-item-btn svg { width:12px; height:12px; }
.add-sec-btn { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:11px; border:1.5px dashed var(--border-strong); border-radius:var(--radius-lg); background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:13px; cursor:pointer; transition:all 0.15s; }
.add-sec-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-bg); }

/* TOAST */
.toast { position:fixed; bottom:1.5rem; right:1.5rem; background:var(--text); color:white; padding:10px 16px; border-radius:var(--radius); font-size:13px; z-index:999; opacity:0; transform:translateY(10px); transition:all 0.25s; pointer-events:none; }
.toast.show { opacity:1; transform:translateY(0); }
.toast.success { background:var(--accent); }
.toast.error { background:var(--danger); }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo"><div class="logo-dot"></div>Checklist</a>
  <nav class="nav">
    <a href="index.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home
    </a>
    <a href="history.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>Ingevuld
    </a>
    <a href="admin.html" class="nav-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41"/></svg>Admin
    </a>
    <button class="btn" id="logout-btn" style="display:none" onclick="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Uitloggen
    </button>
  </nav>
</header>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <h2>Admin login</h2>
    <p>Enkel beheerders kunnen templates aanmaken en bewerken.</p>
    <div class="login-error" id="login-error">Ongeldig e-mailadres of wachtwoord.</div>
    <label class="field-label">E-mailadres</label>
    <input class="field-input" type="email" id="login-email" placeholder="admin@bedrijf.be" autocomplete="email">
    <label class="field-label">Wachtwoord</label>
    <input class="field-input" type="password" id="login-pw" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doLogin()">Inloggen</button>
    <p style="font-size:12px;color:var(--light);margin-top:1rem;text-align:center">Maak eerst een account aan via Supabase → Authentication → Users</p>
  </div>
</div>

<!-- ADMIN SCREEN -->
<div id="admin-screen">
  <div class="container">
    <div class="page-header">
      <div>
        <div class="page-title">Template beheer</div>
        <div class="page-subtitle" id="user-email"></div>
      </div>
      <button class="btn btn-primary" onclick="newTemplate()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nieuwe template
      </button>
    </div>

    <!-- Template list -->
    <div class="template-list" id="tpl-list"></div>

    <!-- Editor -->
    <div id="editor">
      <div class="editor-header">
        <div class="editor-title" id="editor-mode-label">Nieuwe template</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-danger" id="delete-btn" style="display:none" onclick="deleteTemplate()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Verwijder
          </button>
          <button class="btn" onclick="cancelEditor()">Annuleer</button>
          <button class="btn btn-primary" onclick="saveTemplate()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Opslaan
          </button>
        </div>
      </div>

      <!-- Meta fields -->
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">Naam template *</label>
          <input class="field-input" type="text" id="e-name" placeholder="bv. Oplevering silo">
        </div>
        <div class="field-group">
          <label class="field-label">Categorie</label>
          <select class="field-select" id="e-cat">
            <option value="oplevering">Oplevering</option>
            <option value="opstart">Opstart</option>
            <option value="assemblage">Assemblage</option>
            <option value="feedback">Feedback</option>
            <option value="inspectie">Inspectie</option>
            <option value="onderhoud">Onderhoud</option>
            <option value="andere">Andere</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">Omschrijving</label>
          <textarea class="field-textarea" id="e-desc" placeholder="Korte beschrijving van de checklist…"></textarea>
        </div>
        <div class="field-group">
          <label class="field-label">Standaardtaal</label>
          <select class="field-select" id="e-lang">
            <option value="nl">🇧🇪 Nederlands</option>
            <option value="en">🇬🇧 English</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="de">🇩🇪 Deutsch</option>
          </select>
        </div>
      </div>

      <!-- Sections builder -->
      <div style="font-size:13px;font-weight:500;margin-bottom:8px;color:var(--muted)">Secties & vragen</div>
      <div class="sections-wrap" id="sections-editor"></div>
      <button class="add-sec-btn" onclick="addSection()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Sectie toevoegen
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
let currentId = null;
let sections = [];
let idN = 100;
const uid = () => 's' + (++idN) + Date.now().toString(36);

// ── AUTH ──
async function checkAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) showAdmin(session.user);
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  document.getElementById('login-error').style.display = 'none';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error) { document.getElementById('login-error').style.display = 'block'; return; }
  showAdmin(data.user);
}

function showAdmin(user) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'block';
  document.getElementById('logout-btn').style.display = 'flex';
  document.getElementById('user-email').textContent = 'Ingelogd als ' + user.email;
  loadTemplates();
}

async function logout() {
  await sb.auth.signOut();
  location.reload();
}

// ── TEMPLATE LIST ──
async function loadTemplates() {
  const { data } = await sb.from('templates').select('*').order('category').order('name');
  const el = document.getElementById('tpl-list');
  if (!data?.length) {
    el.innerHTML = '<p style="color:var(--muted);font-size:14px">Nog geen templates. Maak er een aan via de knop hierboven.</p>';
    return;
  }
  el.innerHTML = data.map(t => {
    const n = (t.schema?.sections||[]).reduce((a,s)=>a+(s.items?.length||0),0);
    return `<div class="tpl-row">
      <div class="tpl-info">
        <div class="tpl-name">${esc(t.name)}</div>
        <div class="tpl-meta">
          <span class="tpl-badge">${t.category||'Algemeen'}</span>
          <span>${n} vragen</span>
          <span>${t.active?'Actief':'Inactief'}</span>
          ${t.description?`<span>${esc(t.description)}</span>`:''}
        </div>
      </div>
      <div class="tpl-actions">
        <a href="fill.html?template=${t.id}" class="btn" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Preview
        </a>
        <button class="btn" onclick="editTemplate(${JSON.stringify(t).replace(/"/g,'&quot;')})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Bewerken
        </button>
      </div>
    </div>`;
  }).join('');
}

// ── EDITOR ──
function newTemplate() {
  currentId = null;
  sections = [{ id: uid(), title: 'Sectie 1', items: [] }];
  document.getElementById('e-name').value = '';
  document.getElementById('e-desc').value = '';
  document.getElementById('e-cat').value = 'oplevering';
  document.getElementById('e-lang').value = 'nl';
  document.getElementById('editor-mode-label').textContent = 'Nieuwe template';
  document.getElementById('delete-btn').style.display = 'none';
  renderSections();
  document.getElementById('editor').style.display = 'block';
  document.getElementById('editor').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function editTemplate(t) {
  currentId = t.id;
  sections = JSON.parse(JSON.stringify(t.schema?.sections || []));
  // ensure items have all required fields
  sections.forEach(s => s.items.forEach(i => {
    if (!i.id) i.id = uid();
    if (!i.type) i.type = 'check';
    if (i.required === undefined) i.required = false;
  }));
  document.getElementById('e-name').value = t.name || '';
  document.getElementById('e-desc').value = t.description || '';
  document.getElementById('e-cat').value = t.category || 'andere';
  document.getElementById('e-lang').value = t.lang || 'nl';
  document.getElementById('editor-mode-label').textContent = 'Bewerken: ' + t.name;
  document.getElementById('delete-btn').style.display = 'flex';
  renderSections();
  document.getElementById('editor').style.display = 'block';
  document.getElementById('editor').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function cancelEditor() {
  document.getElementById('editor').style.display = 'none';
  currentId = null;
}

// ── SECTIONS RENDER ──
function renderSections() {
  const wrap = document.getElementById('sections-editor');
  wrap.innerHTML = '';
  sections.forEach((sec, si) => {
    const el = document.createElement('div');
    el.className = 'sec-card';
    el.innerHTML = `
      <div class="sec-head">
        <span style="font-size:12px;color:var(--light);font-weight:500">§${si+1}</span>
        <input class="sec-title-input" value="${esc(sec.title)}" placeholder="Sectietitel…"
          oninput="sections[${si}].title=this.value">
        <button class="icon-btn" onclick="moveSection(${si},-1)" title="Omhoog" ${si===0?'disabled style="opacity:0.3"':''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
        <button class="icon-btn" onclick="moveSection(${si},1)" title="Omlaag" ${si===sections.length-1?'disabled style="opacity:0.3"':''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <button class="icon-btn btn-danger" onclick="deleteSection(${si})" title="Verwijder sectie">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="items-wrap" id="items-${si}"></div>
      <div class="add-item-row" style="padding:8px 14px 10px">
        <button class="add-item-btn" onclick="addItem(${si},'check')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Vinkpunt
        </button>
        <button class="add-item-btn" onclick="addItem(${si},'text')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>Tekstveld
        </button>
        <button class="add-item-btn" onclick="addItem(${si},'radio')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>Keuze
        </button>
        <button class="add-item-btn" onclick="addItem(${si},'photo')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Foto-punt
        </button>
        <button class="add-item-btn" onclick="addItem(${si},'date')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Datum
        </button>
        <button class="add-item-btn" onclick="addItem(${si},'number')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>Getal
        </button>
      </div>`;

    const iw = el.querySelector(`#items-${si}`);
    sec.items.forEach((item, ii) => iw.appendChild(renderItem(si, ii, item)));
    wrap.appendChild(el);
  });
}

const TYPE_LABELS = { check:'Vinkpunt', text:'Tekstveld', radio:'Keuze', photo:'Foto', date:'Datum', number:'Getal', signature:'Handtekening' };

function renderItem(si, ii, item) {
  const el = document.createElement('div');
  el.className = 'item-row';
  el.innerHTML = `
    <div class="item-fields">
      <input class="item-label-input" style="width:100%" value="${esc(item.label||'')}" placeholder="Vraagtekst…"
        oninput="sections[${si}].items[${ii}].label=this.value">
      <select class="item-type-select" onchange="changeItemType(${si},${ii},this.value)">
        ${Object.entries(TYPE_LABELS).map(([v,l])=>`<option value="${v}"${item.type===v?' selected':''}>${l}</option>`).join('')}
      </select>
      <label class="item-req">
        <input type="checkbox" ${item.required?'checked':''} onchange="sections[${si}].items[${ii}].required=this.checked">
        Verplicht
      </label>
      <div style="display:flex;gap:4px">
        <button class="icon-btn" onclick="moveItem(${si},${ii},-1)" ${ii===0?'disabled style="opacity:0.3"':''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
        <button class="icon-btn" onclick="moveItem(${si},${ii},1)" ${ii===sections[si].items.length-1?'disabled style="opacity:0.3"':''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <button class="icon-btn" onclick="deleteItem(${si},${ii})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    ${item.type==='radio'?`<input class="item-options-input" placeholder="Opties gescheiden door komma, bv: Ja, Nee, N/A"
      value="${esc((item.options||[]).join(', '))}"
      onchange="sections[${si}].items[${ii}].options=this.value.split(',').map(s=>s.trim()).filter(Boolean);renderSections()">`:
     item.type==='text'?`<input class="item-options-input" placeholder="Hint / instructie (optioneel)"
      value="${esc(item.hint||'')}" oninput="sections[${si}].items[${ii}].hint=this.value">`:
     item.type==='number'?`<input class="item-options-input" placeholder="Eenheid (optioneel, bv: kg, °C, mm)"
      value="${esc(item.unit||'')}" oninput="sections[${si}].items[${ii}].unit=this.value">`:
    ''}`;
  return el;
}

// ── ITEM/SECTION ACTIONS ──
function addSection() {
  sections.push({ id:uid(), title:'Nieuwe sectie', items:[] });
  renderSections();
}
function deleteSection(si) {
  if (!confirm('Sectie verwijderen?')) return;
  sections.splice(si, 1);
  renderSections();
}
function moveSection(si, dir) {
  const j = si+dir;
  if (j<0||j>=sections.length) return;
  [sections[si],sections[j]]=[sections[j],sections[si]];
  renderSections();
}
function addItem(si, type) {
  const ni = { id:uid(), label:'', hint:'', type, required:false };
  if (type==='radio') ni.options=['Ja','Nee','N/A'];
  sections[si].items.push(ni);
  renderSections();
}
function deleteItem(si, ii) {
  sections[si].items.splice(ii,1);
  renderSections();
}
function moveItem(si, ii, dir) {
  const j=ii+dir;
  if (j<0||j>=sections[si].items.length) return;
  [sections[si].items[ii],sections[si].items[j]]=[sections[si].items[j],sections[si].items[ii]];
  renderSections();
}
function changeItemType(si, ii, type) {
  sections[si].items[ii].type = type;
  if (type==='radio'&&!sections[si].items[ii].options) sections[si].items[ii].options=['Ja','Nee','N/A'];
  renderSections();
}

// ── SAVE / DELETE ──
async function saveTemplate() {
  const name = document.getElementById('e-name').value.trim();
  if (!name) { toast('Geef een naam op', 'error'); return; }
  const payload = {
    name,
    description: document.getElementById('e-desc').value.trim(),
    category: document.getElementById('e-cat').value,
    lang: document.getElementById('e-lang').value,
    schema: { sections },
    updated_at: new Date().toISOString()
  };
  let error;
  if (currentId) {
    ({ error } = await sb.from('templates').update(payload).eq('id', currentId));
  } else {
    ({ error } = await sb.from('templates').insert({ ...payload, active:true }));
  }
  if (error) { toast('Fout bij opslaan: ' + error.message, 'error'); return; }
  toast('Template opgeslagen!', 'success');
  cancelEditor();
  loadTemplates();
}

async function deleteTemplate() {
  if (!confirm('Template verwijderen? Dit verwijdert ook alle gekoppelde ingevulde checklists.')) return;
  const { error } = await sb.from('templates').delete().eq('id', currentId);
  if (error) { toast('Fout: ' + error.message, 'error'); return; }
  toast('Template verwijderd');
  cancelEditor();
  loadTemplates();
}

// ── UTILS ──
function toast(msg, type='') {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show '+(type||'');
  setTimeout(()=>el.className='toast',2800);
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

checkAuth();
</script>
